[project]
name = "research-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "python-multipart>=0.0.20", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "langgraph>=1,<2", "chromadb>=1,<2", "rank-bm25>=0.2.2,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
